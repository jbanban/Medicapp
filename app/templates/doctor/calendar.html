{% extends 'base/layout.html' %}
{% block title %}Calendar | MEDICAPP{% endblock %}
{% block content %}
<div class="flex bg-gray-100 w-full">
    
    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col">

    
    <!-- SHARED CALENDAR HEADER -->
    <header class="flex items-center justify-between px-4 py-2 border-b bg-white">

        <div class="flex items-center gap-4">

            <!-- Logo -->
            <div class="flex items-center gap-2">
                <a href="{{ url_for('doctor.doctor_dashboard') }}" class="flex items-center">
                    <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                        <img src="{{ url_for('static', filename='img/logo.png')}}" alt="logo" >
                    </div>
                    <span class="text-xl font-medium text-gray-700">MEDICAPP</span>
                </a>
            </div>

            <!-- Today Button -->
            <button id="todayBtn"
                    class="px-5 py-2 border border-gray-300 rounded-full hover:bg-gray-50 text-sm font-medium">
                Today
            </button>

            <!-- Navigation Arrows -->
            <div class="flex items-center">
                <!-- PREVIOUS -->
                <button id="prevBtn" class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>

                <!-- NEXT -->
                <button id="nextBtn" class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>

            <div class="flex items-baseline gap-3 text-xl font-normal text-gray-700">
                <span id="monthTitle" class="hidden"></span>
                <span id="weekNumber" class="hidden text-gray-500"></span>
                <span id="headerTitle" class="hidden"></span>
            </div>

        </div>

        <!-- View Switch -->
        <div class="relative">
            <div class="flex items-center gap-2">
                <button class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </button>
                <button class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" stroke-width="2"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4m0-4h.01"/>
                    </svg>
                </button>

                <button class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>

                <!-- View Toggle Button -->
                <div class="relative">
                    <button id="viewToggleBtn"
                            class="px-4 py-2 border border-gray-300 rounded-full hover:bg-gray-50 text-sm font-medium flex items-center gap-1">
                        <span id="currentViewLabel">Month</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- Dropdown -->
                    <div id="viewDropdown"
                        class="hidden absolute mt-2 w-32 bg-white border rounded-lg shadow z-50">
                        <button data-view="month"
                                class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100">
                            Month
                        </button>
                        <button data-view="week"
                                class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100">
                            Week
                        </button>
                        <button data-view="day"
                                class="block w-full text-left px-4 py-2 text-sm hover:bg-gray-100">
                            Day
                        </button>
                    </div>
                </div>

                <button class="p-2 hover:bg-gray-100 rounded-lg border border-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </button>

                <button class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </button>

                <button class="p-2 hover:bg-gray-100 rounded-full">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                    </svg>
                </button>
            </div>
        </div>

    </header>

    <div class="calendarContent">
        <!-- Main Content -->
        <div id="monthView" class="flex">
            <!-- Sidebar -->
            <aside class="w-72 border-r border-gray-200 p-4 sticky top-0 h-screen bg-white overflow-y-auto">

                <!-- Create Button -->
                <button class="flex items-center gap-3 px-4 py-3 mb-4 bg-white border border-gray-300 rounded-full shadow-sm hover:shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span class="font-medium">Create</span>
                </button>

                <!-- Mini Calendar -->
                <div class="mb-6">
                    <!-- Day labels -->
                    <div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-600 mb-2">
                        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
                    </div>

                    <div id="miniCalendarDays" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
                </div>

                <!-- My calendars -->
                <div class="mb-4">
                    <div class="flex items-center justify-between px-2 py-2">
                        <span class="text-sm font-medium">My calendars</span>
                        <button class="p-1 hover:bg-gray-100 rounded">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </button>
                    </div>
                    <div class="space-y-1">
                        <label class="flex items-center gap-2 px-2 py-1 hover:bg-gray-100 rounded cursor-pointer">
                            <input type="checkbox" checked class="w-4 h-4 text-blue-600 rounded">
                            <span class="text-sm">jenel eric</span>
                        </label>
                        <label class="flex items-center gap-2 px-2 py-1 hover:bg-gray-100 rounded cursor-pointer">
                            <input type="checkbox" checked class="w-4 h-4 text-green-600 rounded">
                            <span class="text-sm">Birthdays</span>
                        </label>
                        <label class="flex items-center gap-2 px-2 py-1 hover:bg-gray-100 rounded cursor-pointer">
                            <input type="checkbox" checked class="w-4 h-4 text-blue-600 rounded">
                            <span class="text-sm">Tasks</span>
                        </label>
                    </div>
                </div>


                <!-- Footer Links -->
                <div class="flex items-center gap-2 px-2 text-xs text-gray-600">
                    <a href="#" class="hover:underline">Terms</a>
                    <span>-</span>
                    <a href="#" class="hover:underline">Privacy</a>
                </div>
            </aside>
        
            <!-- Calendar Grid -->
            <div class="flex-1 overflow-x-auto bg-gray-50">

                <!-- Day Headers (JS will fill this) -->
                <div id="dayHeaders" class="grid grid-cols-7 bg-white border-b border-gray-200 sticky top-0 z-20">
                </div>

                <!-- Calendar Days Grid -->
                <div id="calendarGrid" class="grid grid-cols-7 auto-rows-[minmax(120px,1fr)] bg-white">
                </div>
            </div>
        </div>

        <div id="weekView" class="hidden">
            {% include 'doctor/scheduler.html' %}
        </div>
    </div>
{% endblock %}
{% block scripts %}
<script>
/* ================================
   GLOBAL CALENDAR STATE
================================ */
const calendarState = {
    currentDate: new Date(),
    view: "month" // month | week
};
const months = [
  "January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"
];

/* ================================
   VIEW SWITCHING
================================ */
function showView(view) {
    calendarState.view = view;

    const monthView = document.getElementById("monthView");
    const weekView  = document.getElementById("weekView");

    if (monthView) monthView.classList.add("hidden");
    if (weekView)  weekView.classList.add("hidden");

    if (view === "month" && monthView) monthView.classList.remove("hidden");
    if (view === "week"  && weekView)  weekView.classList.remove("hidden");

    const label = document.getElementById("currentViewLabel");
    if (label) {
        label.textContent = view.charAt(0).toUpperCase() + view.slice(1);
    }

    updateHeaderTitle();
    render();
}

function updateTitle() {
    const monthTitle = document.getElementById("monthTitle");
    if (!monthTitle) return;

    const d = calendarState.currentDate;
    monthTitle.textContent = `${months[d.getMonth()]} ${d.getFullYear()}`;
}

function renderMiniCalendar(month, year) {
    const container = document.getElementById("miniCalendarDays");
    if (!container) return;

    container.innerHTML = "";

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        container.innerHTML += `<div></div>`;
    }

    for (let d = 1; d <= daysInMonth; d++) {
        container.innerHTML += `
            <div class="py-1 rounded hover:bg-blue-100 cursor-pointer">
                ${d}
            </div>
        `;
    }
}


function renderCalendar(month, year) {
    calendarGrid.innerHTML = "";
    dayHeaders.innerHTML = "";

    updateTitle();
    renderMiniCalendar(month, year);

    const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
    const firstOfMonth = new Date(year, month, 1);
    const startDay = firstOfMonth.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    // for (let i = 0; i < totalCells; i++) {
    //     const cellDate = new Date(year, month, i - startDay + 1);
    //     const isToday = cellDate.toDateString() === today.toDateString();
    // }

    // ===== DAY HEADERS =====
    for (let i = 0; i < 7; i++) {
        dayHeaders.innerHTML += `
            <div
                class="border-r border-gray-200 last:border-r-0 text-center py-3
                       text-xs font-medium text-gray-600">
                ${days[i]}
            </div>
        `;
    }

    // ===== CALENDAR GRID =====
    const totalCells = Math.ceil((startDay + daysInMonth) / 7) * 7;

    for (let i = 0; i < totalCells; i++) {
        const cellDate = new Date(year, month, i - startDay + 1);
        const isCurrentMonth = cellDate.getMonth() === month;
        const isToday = cellDate.toDateString() === today.toDateString();
        const formattedDate = cellDate.toISOString().split("T")[0];
        const day = cellDate.getDate();

        calendarGrid.innerHTML += `
            <div
                class="relative border-t border-r border-gray-200 last:border-r-0 p-2
                       cursor-pointer transition-colors group
                       ${isCurrentMonth ? "bg-white" : "bg-gray-50"}
                       hover:bg-blue-50"
                onclick="openWeekFromDate('${formattedDate}')"
            >
                <div class="flex justify-between items-start mb-1">
                    <span class="text-xs font-medium
                        ${!isCurrentMonth ? "text-gray-400" : "text-gray-700"}
                        ${isToday ? "bg-blue-600 text-white rounded-full w-6 h-6 inline-flex items-center justify-center" : ""}
                    ">
                        ${day}
                    </span>
                </div>

                <!-- Event space -->
                <div class="space-y-1"></div>
            </div>
        `;
    }
}


// ===== Schedule navigation =====
const schedulerUrl = "{{ url_for('doctor.scheduler') }}";

function openWeekFromDate(dateString) {
    const clickedDate = new Date(dateString);

    calendarState.currentDate = clickedDate;
    calendarState.view = "week";

    // Align week to clicked day
    if (window.state && window.getStartOfWeek) {
        state.currentWeekStart = getStartOfWeek(clickedDate);
    }

    showView("week");
}


function getWeekNumber(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const dayNum = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

/* ================================
   HEADER TITLE
================================ */
function updateHeaderTitle() {
    const monthTitle  = document.getElementById("monthTitle");
    const weekNumber  = document.getElementById("weekNumber");
    const headerTitle = document.getElementById("headerTitle");

    if (!monthTitle || !weekNumber || !headerTitle) return;

    // Hide all first
    monthTitle.classList.add("hidden");
    weekNumber.classList.add("hidden");
    headerTitle.classList.add("hidden");

    const d = calendarState.currentDate;

    /* ===== MONTH VIEW ===== */
    if (calendarState.view === "month") {
        monthTitle.textContent =
            `${months[d.getMonth()]} ${d.getFullYear()}`;
        monthTitle.classList.remove("hidden");
    }

    /* ===== WEEK VIEW ===== */
    if (calendarState.view === "week") {
        const start = new Date(d);
        start.setDate(d.getDate() - d.getDay());

        const end = new Date(start);
        end.setDate(start.getDate() + 6);

        weekNumber.textContent = `Week ${getWeekNumber(d)}`;
        headerTitle.textContent =
            `${start.toLocaleDateString()} – ${end.toLocaleDateString()}`;

        weekNumber.classList.remove("hidden");
        headerTitle.classList.remove("hidden");
    }
}


function getStartOfWeek(date) {
    const d = new Date(date);
    const day = d.getDay(); // 0 = Sunday
    d.setDate(d.getDate() - day);
    d.setHours(0, 0, 0, 0);
    return d;
}


/* ================================
   MAIN RENDER SWITCH
================================ */
function render() {
    updateHeaderTitle();

    if (calendarState.view === "month") {
        window.renderCalendar?.(
            calendarState.currentDate.getMonth(),
            calendarState.currentDate.getFullYear()
        );
    }

    if (calendarState.view === "week") {
        if (window.state && window.getStartOfWeek) {
            state.currentWeekStart = getStartOfWeek(calendarState.currentDate);
            window.renderSchedCalendar?.();
        }
    }

}

/* ================================
   DOM READY
================================ */
document.addEventListener("DOMContentLoaded", () => {

    /* ---------- HEADER BUTTONS ---------- */
    const todayBtn = document.getElementById("todayBtn");
    const prevBtn  = document.getElementById("prevBtn");
    const nextBtn  = document.getElementById("nextBtn");

    if (todayBtn) {
        todayBtn.onclick = () => {
            calendarState.currentDate = new Date();
            render();
        };
    }

    if (prevBtn) {
        prevBtn.onclick = () => {
            if (calendarState.view === "month") {
                calendarState.currentDate.setMonth(
                    calendarState.currentDate.getMonth() - 1
                );
            } else {
                calendarState.currentDate.setDate(
                    calendarState.currentDate.getDate() - 7
                );
            }
            render();
        };
    }

    if (nextBtn) {
        nextBtn.onclick = () => {
            if (calendarState.view === "month") {
                calendarState.currentDate.setMonth(
                    calendarState.currentDate.getMonth() + 1
                );
            } else {
                calendarState.currentDate.setDate(
                    calendarState.currentDate.getDate() + 7
                );
            }
            render();
        };
    }

    /* ---------- VIEW DROPDOWN ---------- */
    const viewToggleBtn = document.getElementById("viewToggleBtn");
    const viewDropdown  = document.getElementById("viewDropdown");

    if (viewToggleBtn && viewDropdown) {
        viewToggleBtn.onclick = (e) => {
            e.stopPropagation();
            viewDropdown.classList.toggle("hidden");
        };

        viewDropdown.querySelectorAll("button").forEach(btn => {
            btn.onclick = () => showView(btn.dataset.view);
        });

        document.addEventListener("click", () => {
            viewDropdown.classList.add("hidden");
        });
    }

    /* ---------- INITIAL LOAD ---------- */
    showView("month");
});
(function autoSwitchToWeek() {
    const params = new URLSearchParams(window.location.search);
    if (params.get("view") === "week" && params.has("date")) {

        const clickedDate = new Date(params.get("date"));

        calendarState.currentDate = new Date(clickedDate);
        calendarState.view = "week";

        if (window.state && window.getStartOfWeek) {
            state.currentWeekStart = getStartOfWeek(clickedDate);
        }

        showView("week");
    }
})();

</script>
{% endblock %}
