<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assistant Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">

        <!-- Page Header -->
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800">
                Assistant / Secretary Management
            </h1>
            <p class="text-gray-500 mt-1">
                Manage clinic assistants and secretaries
            </p>
        </div>

        <!-- CRUD Form Card -->
        <div class="bg-white rounded-2xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">
                Add / Update Secretary
            </h2>

            <form method="POST" action="#">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <!-- First Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            First Name
                        </label>
                        <input type="text" name="first_name"
                               class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"
                               required>
                    </div>

                    <!-- Last Name -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Last Name
                        </label>
                        <input type="text" name="last_name"
                               class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"
                               required>
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Username
                        </label>
                        <input type="text" name="username"
                               class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none"
                               required>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-gray-600">
                            Password
                        </label>
                        <input type="password" name="password"
                               class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                    </div>

                </div>

                <!-- Buttons -->
                <div class="mt-6 flex justify-end space-x-3">
                    <button type="reset"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                        Clear
                    </button>
                    <button type="submit"
                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        Save
                    </button>
                </div>
            </form>
        </div>


        <!-- Secretary Table List -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">
                Secretary List
            </h2>

            <div class="overflow-x-auto">
                <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">ID</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Full Name</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Username</th>
                            <th class="px-4 py-3 text-left text-sm font-semibold text-gray-600">Status</th>
                            <th class="px-4 py-3 text-center text-sm font-semibold text-gray-600">Actions</th>
                        </tr>
                    </thead>

                    <tbody class="divide-y divide-gray-200">

                        <!-- Example Row -->
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 text-sm text-gray-700">1</td>
                            <td class="px-4 py-3 text-sm text-gray-700">
                                Maria Santos
                            </td>
                            <td class="px-4 py-3 text-sm text-gray-700">
                                maria.sec
                            </td>
                            <td class="px-4 py-3">
                                <span class="px-2 py-1 text-xs font-medium bg-green-100 text-green-700 rounded-full">
                                    Active
                                </span>
                            </td>
                            <td class="px-4 py-3 text-center space-x-2">

                                <!-- Edit Button -->
                                <button
                                    class="px-3 py-1 bg-yellow-400 text-white text-sm rounded-lg hover:bg-yellow-500 transition">
                                    Edit
                                </button>

                                <!-- Delete Button -->
                                <button
                                    class="px-3 py-1 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600 transition">
                                    Delete
                                </button>

                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
