<!-- MEDICAL DETAILS CARD -->
<div class="bg-white shadow-lg rounded-xl p-6">

    <h2 class="text-2xl font-bold text-gray-800 mb-6">
        Documents
    </h2>

    <div class="space-y-4">
    {% for q in doctor.backgrounds if q.type == 'qualification' %}
        <li class="border rounded p-3">
            <form
                action="{{ url_for('doctor.update_background', bg_id=q.id, doctor_id=doctor.doctor_id) }}"
                method="POST"
                class="space-y-2"
            >
                <input name="title" value="{{ q.title }}" class="w-full p-2 border rounded">
                <input name="organization" value="{{ q.organization }}" class="w-full p-2 border rounded">
                <input name="year" value="{{ q.year }}" class="w-full p-2 border rounded">

                <div class="flex gap-2">
                <button class="px-3 py-1 bg-blue-600 text-white rounded text-sm">Save</button>
                </div>
            </form>

            <form
                action="{{ url_for('doctor.delete_background', bg_id=q.id, doctor_id=doctor.doctor_id) }}"
                method="POST"
                class="mt-2"
                onsubmit="return confirm('Delete this qualification?')"
            >
                <button class="text-sm text-red-600">Delete</button>
            </form>
        </li>
            {% else %}
        <li class="text-sm text-gray-500">No qualifications added.</li>
            {% endfor %}
        </li>
    </div>
</div>
