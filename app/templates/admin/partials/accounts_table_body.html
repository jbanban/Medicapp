{% for account in accounts %}
<tr class="hover:bg-blue-50 transition">
    <td class="px-6 py-4 text-sm font-medium text-gray-800">
        {{ account.username }}
    </td>

    <td class="px-6 py-4 text-sm">
        {% if account.doctor %}
            <span class="px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">
                Profile Complete
            </span>
        {% else %}
            <a href="{{ url_for('admin.create_doctor_profile', account_id=account.account_id) }}"
               class="px-3 py-1 rounded-full text-xs font-medium bg-red-200
                      text-black hover:bg-red-300 flex gap-3 w-28 items-center">
                No Profile
                <img src="{{ url_for('static', filename='img/pen.png') }}" class="w-4">
            </a>
        {% endif %}
    </td>

    <td class="px-6 py-4 text-sm">
        <a href="{{ url_for('admin.admin_doctors', account_id=account.account_id) }}"
           class="text-blue-600 hover:text-blue-800 font-medium">
            Edit
        </a>
    </td>
</tr>
{% endfor %}
