{% extends 'base/layout.html' %}

{% block title %}Edit Doctor Profile{% endblock %}

{% block content %}
<div class="w-full bg-gray-50 px-6 py-8">
  <div class="flex flex-col lg:flex-row gap-6">

    <div class="w-full">
      <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        <!-- Header -->
        <div class="px-6 py-5 border-b border-gray-200 flex justify-between items-center bg-blue-50">
          <h3 class="text-xl font-semibold text-blue-700">
            Edit Doctor Profile
          </h3>

          <a href="{{ url_for('admin.admin_doctors') }}"
             class="text-gray-500 hover:text-gray-800 transition text-xl">
            ✕
          </a>
        </div>

        <div class="px-6 py-6">

          <form method="POST" class="space-y-6">

            <!-- Linked Account -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">
                Linked Account
              </label>
              <select name="account_id"
                      class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                {% for acc in accounts %}
                  <option value="{{ acc.account_id }}"
                    {% if acc.account_id == doctor.account_id %}selected{% endif %}>
                    {{ acc.username }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <!-- Name -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                <input type="text" name="firstname"
                       value="{{ doctor.firstname }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
                <input type="text" name="middlename"
                       value="{{ doctor.middlename }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                <input type="text" name="lastname"
                       value="{{ doctor.lastname }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <!-- Age / Blood / Height / Weight -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Age</label>
                <input type="number" name="age"
                       value="{{ doctor.age }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Blood Type</label>
                <select name="bloodtype"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                  <option {% if doctor.bloodtype == 'A' %}selected{% endif %}>A</option>
                  <option {% if doctor.bloodtype == 'B' %}selected{% endif %}>B</option>
                  <option {% if doctor.bloodtype == 'AB' %}selected{% endif %}>AB</option>
                  <option {% if doctor.bloodtype == 'O' %}selected{% endif %}>O</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Height (cm)</label>
                <input type="text" name="height"
                       value="{{ doctor.height }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Weight (kg)</label>
                <input type="text" name="weight"
                       value="{{ doctor.weight }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <!-- Specialization / Gender / DOB -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Specialization</label>
                <input type="text" name="specialization"
                       value="{{ doctor.specialization }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
                <select name="gender"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                  <option {% if doctor.gender == 'Male' %}selected{% endif %}>Male</option>
                  <option {% if doctor.gender == 'Female' %}selected{% endif %}>Female</option>
                  <option {% if doctor.gender == 'Undecided' %}selected{% endif %}>Undecided</option>
                </select>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth</label>
                <input type="date" name="dob"
                       value="{{ doctor.dob }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <!-- Contact -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contact Number</label>
                <input type="text" name="phone"
                       value="{{ doctor.phone }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email"
                       value="{{ doctor.email }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
              </div>
            </div>

            <!-- Submit -->
            <div class="text-center pt-6">
              <button type="submit"
                      class="px-10 py-3 bg-blue-600 text-white font-semibold rounded-xl
                             hover:bg-blue-700 shadow-lg transition">
                Save Changes
              </button>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
