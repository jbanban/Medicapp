<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" href="data:,">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% block styles %}{% endblock %}
</head>
<body>
    <div class="flex min-h-screen">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>

    <script>

    window.encryptData = function(data) {
        return CryptoJS.AES.encrypt(
            JSON.stringify(data),
            SECRET_KEY
        ).toString();
    }

    window.decryptData = function(cipher) {
        try {
            const bytes = CryptoJS.AES.decrypt(cipher, SECRET_KEY);
            return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
        } catch (e) {
            return {};
        }
    }

    window.safeDecrypt = function(key) {
        const encrypted = localStorage.getItem(key);
        if (!encrypted) return {}; 

        try {
            const bytes = CryptoJS.AES.decrypt(
                encrypted,
                '{{ SECRET_KEY }}'
            );
            const text = bytes.toString(CryptoJS.enc.Utf8);
            return text ? JSON.parse(text) : {};
        } catch (e) {
            console.error('Decrypt failed:', e);
            return {};
        }
    }

    window.loadMedicalVisibility = function(patientId) {
            const key = `patient_${patientId}_medical_visibility`;
            const encrypted = localStorage.getItem(key);
            return encrypted ? decryptData(encrypted) : {};
        }

    window.saveMedicalVisibility = function(patientId, data) {
        const key = `patient_${patientId}_medical_visibility`;
        const encrypted = encryptData(data);
        localStorage.setItem(key, encrypted);
    }

    window.saveToBackend = function(patientId, encrypted) {
        fetch('/api/medical-visibility/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                patient_id: patientId,
                encrypted_state: encrypted
            })
        });
    }

    window.clearPatientStorage = function (patientId) {
        localStorage.removeItem(`patient_${patientId}_medical_visibility`);
    };

    function toggleSidebar(btn) {
        const sidebar = btn.closest('aside');
        if (!sidebar) return;

        const texts = sidebar.querySelectorAll('.sidebar-text');
        const icons = sidebar.querySelectorAll('.sidebar-icon');
        const logo = sidebar.querySelector('.sidebar-logo');

        const collapsed = sidebar.classList.contains('collapsed');

        if (!collapsed) {
            sidebar.classList.add('collapsed', 'w-20');
            sidebar.classList.remove('w-64');

            texts.forEach(t => t.classList.add('hidden'));
            logo?.classList.add('hidden');
            icons.forEach(i => i.classList.add('mx-auto'));
        } else {
            sidebar.classList.remove('collapsed', 'w-20');
            sidebar.classList.add('w-64');

            texts.forEach(t => t.classList.remove('hidden'));
            logo?.classList.remove('hidden');
            icons.forEach(i => i.classList.remove('mx-auto'));
        }
    }


    </script>
    
    {% block scripts %}{% endblock %}
    
</body>
