<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<script>
function notificationHandler() {
    return {
        notifications: [],

        show(message, category = 'success') {
            const id = Date.now();

            this.notifications.push({
                id,
                message,
                category,
                show: true
            });

            setTimeout(() => {
                const note = this.notifications.find(n => n.id === id);
                if (note) note.show = false;
            }, 4000);
        }
    }
}
</script>

<body class="bg-gray-100">

<!-- Notification Container -->
<div 
    x-data="notificationHandler()" 
    class="fixed top-4 right-4 z-50 space-y-3"
>
    <template x-for="note in notifications" :key="note.id">
        <div
            x-show="note.show"
            x-transition
            class="px-4 py-3 rounded-lg shadow-xl flex items-center justify-between w-80 text-white"
            :class="{
                'bg-green-500': note.category === 'success',
                'bg-yellow-500': note.category === 'warning',
                'bg-red-500': note.category === 'danger'
            }"
        >
            <span class="text-sm font-medium" x-text="note.message"></span>

            <button 
                @click="note.show = false"
                class="text-white hover:text-gray-200"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </template>
</div>

</body>
</html>
